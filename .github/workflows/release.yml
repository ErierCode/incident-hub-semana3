# Publica un GitHub Release cuando se crea un tag de versión vX.Y.Z.
# Reconstruye el paquete desde el tag, lo adjunta y toma las notas del CHANGELOG.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: Publicar release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-fund
      - run: npm run lint
      - run: npm run build
      - run: npm run test:ci
      - run: npm run package

      - name: Verificar que el tag coincide con la versión del paquete
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version=$(node -p "require('./package.json').version")
          test "$tag" = "$version" || { echo "El tag v$tag no coincide con package.json ($version)"; exit 1; }

      - name: Comprimir paquete
        run: |
          version=$(node -p "require('./package.json').version")
          (cd dist/incident-hub && zip -qr "../../incident-hub-$version.zip" .)

      - name: Extraer notas del CHANGELOG
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '$0 ~ "^## \\[" v "\\]" {on=1; next} on && /^## \[/ {exit} on' CHANGELOG.md > notes.md
          test -s notes.md || echo "Release $GITHUB_REF_NAME" > notes.md

      - name: Crear release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          flags=""
          case "$GITHUB_REF_NAME" in *-*) flags="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" incident-hub-*.zip \
            --title "IT Incident Hub $GITHUB_REF_NAME" --notes-file notes.md $flags
