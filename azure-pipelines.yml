# IT Incident Hub - Integración continua en Azure Pipelines
# Se ejecuta en el agente self-hosted (pool Default) para cada PR hacia main,
# cada push a main y cada tag de versión v*.

trigger:
  branches:
    include: [main]
  tags:
    include: ['v*']

pr:
  branches:
    include: [main]

pool:
  name: Default

variables:
  nodeVersion: '22.x'
  npm_config_cache: $(Pipeline.Workspace)/.npm

stages:
  - stage: CI
    displayName: Integración continua
    jobs:
      - job: Build
        displayName: Build, pruebas y artefacto
        steps:
          - checkout: self
            clean: true
            fetchDepth: 1

          - task: UseNode@1
            displayName: Usar Node.js $(nodeVersion)
            inputs:
              version: $(nodeVersion)

          - powershell: |
              $version = node -p "require('./package.json').version"
              Write-Host "##vso[task.setvariable variable=appVersion]$version"
              Write-Host "##vso[build.updatebuildnumber]$version+$(Build.BuildId)"
              Write-Host "Versión de la aplicación: $version"
            displayName: Leer versión (SemVer)

          - script: npm ci --no-fund
            displayName: Instalar dependencias (npm ci)

          - script: npm run lint
            displayName: Lint (ESLint)

          - script: npm run build
            displayName: Build

          - script: npm run test:ci
            displayName: Pruebas unitarias e integración (Jest)

          - task: PublishTestResults@2
            displayName: Publicar resultados de pruebas
            condition: succeededOrFailed()
            inputs:
              testResultsFormat: JUnit
              testResultsFiles: '**/reports/junit.xml'
              testRunTitle: Pruebas backend $(appVersion)

          - task: PublishCodeCoverageResults@2
            displayName: Publicar cobertura
            condition: succeededOrFailed()
            inputs:
              summaryFileLocation: backend/coverage/cobertura-coverage.xml

          - powershell: |
              npm audit --json | Out-File -Encoding utf8 npm-audit.json
              npm audit --omit=dev --audit-level=high
              if ($LASTEXITCODE -ne 0) {
                Write-Host "##vso[task.logissue type=error]Vulnerabilidades altas o críticas en dependencias de producción"
                exit 1
              }
              Write-Host "Sin vulnerabilidades altas o críticas en dependencias de producción"
            displayName: Revisión de dependencias (npm audit)

          - script: npm run package
            displayName: Empaquetar aplicación

          - task: ArchiveFiles@2
            displayName: Comprimir paquete
            inputs:
              rootFolderOrFile: dist/incident-hub
              includeRootFolder: false
              archiveType: zip
              archiveFile: $(Build.ArtifactStagingDirectory)/incident-hub-$(appVersion).zip

          - task: CopyFiles@2
            displayName: Adjuntar reporte de dependencias
            inputs:
              Contents: npm-audit.json
              TargetFolder: $(Build.ArtifactStagingDirectory)

          - task: PublishPipelineArtifact@1
            displayName: Publicar artefacto
            inputs:
              targetPath: $(Build.ArtifactStagingDirectory)
              artifact: incident-hub

  # Estrategia de release (ver docs/release-strategy.md):
  #   push a main   -> CI + despliegue automático en DEV
  #   tag vX.Y.Z    -> CI -> DEV -> QA (smoke test) -> PROD (aprobación manual en el Environment)
  # Los PR solo ejecutan la etapa CI.
  - template: devops/templates/deploy-stage.yml
    parameters:
      stageName: Deploy_DEV
      displayName: Desplegar en DEV
      environment: dev
      port: 3001
      dbPort: 5441
      passwordVariable: DB_PASSWORD_DEV
      dependsOn: CI
      condition: and(succeeded('CI'), or(eq(variables['Build.SourceBranch'], 'refs/heads/main'), startsWith(variables['Build.SourceBranch'], 'refs/tags/v')))

  - template: devops/templates/deploy-stage.yml
    parameters:
      stageName: Deploy_QA
      displayName: Desplegar en QA
      environment: qa
      port: 3002
      dbPort: 5442
      passwordVariable: DB_PASSWORD_QA
      dependsOn: Deploy_DEV
      condition: and(succeeded('Deploy_DEV'), startsWith(variables['Build.SourceBranch'], 'refs/tags/v'))

  - template: devops/templates/deploy-stage.yml
    parameters:
      stageName: Deploy_PROD
      displayName: Desplegar en PROD (requiere aprobación)
      environment: prod
      port: 3003
      dbPort: 5443
      passwordVariable: DB_PASSWORD_PROD
      dependsOn: Deploy_QA
      condition: and(succeeded('Deploy_QA'), startsWith(variables['Build.SourceBranch'], 'refs/tags/v'))
